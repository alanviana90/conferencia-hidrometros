<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atualizar aplicativo</title>
<style>
  body { font: 18px system-ui, sans-serif; margin: 0; padding: 24px; background: #0f1418; color: #fff; }
  main { max-width: 560px; margin: 40px auto; }
  button { width: 100%; padding: 18px; border: 0; border-radius: 12px; background: #1a56db; color: white; font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; }
  p { line-height: 1.5; }
</style>
<main>
  <h1>Atualizar aplicativo</h1>
  <p>Corrige arquivos de versões diferentes e mantém as conferências, os lacres e as configurações salvos neste aparelho.</p>
  <button id="atualizar">Atualizar e voltar ao histórico</button>
  <p id="status" role="status"></p>
</main>
<script>
  document.querySelector('#atualizar').addEventListener('click', async event => {
    const button = event.currentTarget;
    const status = document.querySelector('#status');
    button.disabled = true;
    status.textContent = 'Atualizando os arquivos do aplicativo. Aguarde…';
    try {
      if (!('serviceWorker' in navigator)) throw new Error('Abra este link no navegador usado na conferência.');
      const scope = new URL('./', location.href).href;
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const registration of registrations) {
        if (registration.scope === scope) await registration.unregister();
      }
      // O banco de conferências (IndexedDB) e as configurações são preservados.
      const keys = await caches.keys();
      await Promise.all(keys.filter(key => key.startsWith('hidrometros-cache-')).map(key => caches.delete(key)));
      const registration = await navigator.serviceWorker.register('./service-worker.js', { scope: './', updateViaCache: 'none' });
      await new Promise((resolve, reject) => {
        const worker = registration.installing || registration.waiting || registration.active;
        if (!worker) return reject(new Error('Não foi possível iniciar a atualização.'));
        const timer = setTimeout(() => reject(new Error('A conexão demorou. Verifique a internet e tente novamente.')), 45000);
        const check = () => {
          if (worker.state === 'activated') { clearTimeout(timer); resolve(); }
          else if (worker.state === 'redundant') { clearTimeout(timer); reject(new Error('Não foi possível baixar todos os arquivos. Tente novamente.')); }
        };
        worker.addEventListener('statechange', check);
        check();
      });
      location.replace(new URL('./?atualizado=v11#/historico', location.href));
    } catch (error) {
      status.textContent = error.message;
      button.disabled = false;
    }
  });
</script>
</html>
